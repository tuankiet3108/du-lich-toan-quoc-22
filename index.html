
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAVER.ECO - Đăng nhập</title>

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                115deg,
                #fff4ef,
                #f8f8f8 55%,
                #fff4ef
            );
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            align-items: center;
            padding: 32px;
            gap: 60px;
        }

        /* LEFT IMAGE */

        .left-section {
            height: calc(100vh - 64px);
            min-height: 500px;
            border-radius: 32px;
            position: relative;
            overflow: hidden;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.05) 30%,
                    rgba(255,117,48,0.95) 85%,
                    #83b8d1 100%
                ),
                url("https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200");

            background-size: cover;
            background-position: center;
        }

        .brand {
            position: absolute;
            top: 55px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #ff7135;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-icon {
            font-size: 35px;
        }

        .left-arrow {
            position: absolute;
            bottom: 75px;
            left: 115px;
            color: #ff7135;
            font-size: 32px;
            font-weight: 300;
        }

        /* RIGHT SECTION */

        .right-section {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 52px;
        }

        .heading h1 {
            color: #ff7839;
            font-size: clamp(32px, 4vw, 50px);
            font-weight: 700;
            letter-spacing: -2px;
            white-space: nowrap;
        }

        .heading p {
            font-size: 25px;
            font-weight: 300;
            color: #111;
            margin-top: 5px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #181818;
        }

        .required {
            color: #ff423b;
        }

        .input-box {
            width: 100%;
            height: 57px;
            border: 1px solid #888;
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            transition: 0.3s;
        }

        .input-box:focus-within {
            border-color: #ff7839;
            box-shadow: 0 0 0 3px rgba(255,120,57,0.12);
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            color: #333;
        }

        .input-box input::placeholder {
            color: #858585;
        }

        .eye {
            font-size: 23px;
            color: #777;
            cursor: pointer;
            user-select: none;
        }

        /* FORGOT PASSWORD */

        .forgot {
            display: block;
            text-align: right;
            color: #777;
            font-size: 14px;
            text-decoration: none;
            margin-top: -5px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .forgot:hover {
            color: #ff7839;
        }

        /* BUTTONS */

        .button-group {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .btn {
            width: 158px;
            height: 53px;
            border: none;
            border-radius: 14px;
            background: #ff7839;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ed6327;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,120,57,0.25);
        }

        /* DIVIDER */

        .divider {
            display: flex;
            align-items: center;
            gap: 17px;
            margin: 42px 0 28px;
            color: #888;
            font-size: 14px;
            white-space: nowrap;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #aaa;
        }

        /* GOOGLE */

        .google-wrapper {
            display: flex;
            justify-content: center;
        }

        .google-btn {
            width: 114px;
            height: 57px;
            border: 1px solid #888;
            border-radius: 14px;
            background: transparent;
            cursor: pointer;
            font-size: 30px;
            font-weight: 700;
            transition: 0.3s;
        }

        .google-btn:hover {
            background: white;
            box-shadow: 0 4px 12px #ddd;
        }

        .google-g {
            background: conic-gradient(
                from -45deg,
                #4285f4 0deg 90deg,
                #34a853 90deg 180deg,
                #fbbc05 180deg 270deg,
                #ea4335 270deg 360deg
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr 1fr;
                gap: 25px;
                padding: 20px;
            }

            .heading h1 {
                white-space: normal;
            }

            .heading p {
                font-size: 20px;
            }

            .button-group {
                gap: 12px;
            }

            .btn {
                width: 50%;
            }
        }

        @media (max-width: 650px) {
            .container {
                display: flex;
                justify-content: center;
                padding: 25px 15px;
            }

            .left-section {
                display: none;
            }

            .right-section {
                max-width: 450px;
                padding: 15px;
            }

            .heading {
                margin-bottom: 40px;
            }

            .heading h1 {
                font-size: 35px;
                letter-spacing: -1px;
            }

            .heading p {
                font-size: 19px;
            }

            .form-group label {
                font-size: 16px;
            }

            .button-group {
                gap: 15px;
            }

            .btn {
                width: 50%;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT IMAGE -->
        <div class="left-section">

            <div class="brand">
                <span class="brand-icon">⬡</span>
                <span>TRAVER.ECO</span>
            </div>

            <div class="left-arrow">↗</div>

        </div>

        <!-- RIGHT LOGIN -->
        <div class="right-section">

            <div class="heading">
                <h1>Du lịch toàn quốc</h1>
                <p>Trung tâm nhận thưởng</p>
            </div>

            <form id="loginForm">

                <!-- EMAIL -->
                <div class="form-group">
                    <label>
                        Số điện thoại hoặc email
                        <span class="required">(*)</span>
                    </label>

                    <div class="input-box">
                        <input
                            type="text"
                            id="email"
                            placeholder="Số điện thoại hoặc email"
                            required
                        >
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label>
                        Mật khẩu
                        <span class="required">(*)</span>
                    </label>

                    <div class="input-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Nhập mật khẩu"
                            required
                        >

                        <span class="eye" id="togglePassword"
                              onclick="togglePassword()">◉</span>
                    </div>
                </div>

                <!-- FORGOT -->
                <a href="#" class="forgot"
                   onclick="forgotPassword(event)">
                    Forgot Password?
                </a>

                <!-- BUTTONS -->
                <div class="button-group">

                    <button type="button" class="btn"
                            onclick="register()">
                        Đăng kí ngay
                    </button>

                    <button type="submit" class="btn">
                        Đăng nhập
                    </button>

                </div>

            </form>

            <!-- DIVIDER -->
            <div class="divider">
                or continue with
            </div>

            <!-- GOOGLE -->
            <div class="google-wrapper">
                <button class="google-btn"
                        onclick="googleLogin()">
                    <span class="google-g">G</span>
                </button>
            </div>

        </div>

    </div>

    <script>

        // HIỆN / ẨN MẬT KHẨU
        function togglePassword() {
            const password = document.getElementById("password");

            password.type =
                password.type === "password"
                ? "text"
                : "password";
        }

        // ĐĂNG NHẬP
        document.getElementById("loginForm")
        .addEventListener("submit", function(e) {

            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                alert("Vui lòng nhập đầy đủ thông tin!");
                return;
            }

            alert("Giao diện đăng nhập đã hoạt động!");

            // Tích hợp API đăng nhập tại đây
        });

        // ĐĂNG KÝ
        function register() {
            alert("Chuyển đến trang đăng ký!");
            // window.location.href = "register.html";
        }

        // QUÊN MẬT KHẨU
        function forgotPassword(e) {
            e.preventDefault();
            alert("Chức năng khôi phục mật khẩu!");
        }

        // GOOGLE LOGIN
        function googleLogin() {
            alert("Cần tích hợp Google OAuth để đăng nhập!");
        }

    </script>

</body>
</html>
